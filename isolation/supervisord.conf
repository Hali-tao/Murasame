[supervisord]
nodaemon=true
user=root

# 画面：Xvnc 提供 :1 显示器，websockify 把它包成浏览器能看的 noVNC 页面。
[program:xvnc]
command=Xvnc :1 -geometry 1280x720 -depth 24 -SecurityTypes None -localhost yes -rfbport 5900 -ac
user=murasame
environment=HOME="/home/murasame"
autorestart=true
startretries=20
priority=5

# Browser audio stays inside a null sink; no host audio device or microphone is exposed.
[program:pulseaudio]
command=pulseaudio --daemonize=no --exit-idle-time=-1 --use-pid-file=no --load="module-null-sink sink_name=murasame" --load="module-native-protocol-unix socket=/tmp/murasame-audio.sock auth-anonymous=1"
user=murasame
environment=HOME="/home/murasame"
autorestart=true
startretries=20
priority=7

[program:xfce]
command=startxfce4
user=murasame
environment=DISPLAY=":1",HOME="/home/murasame"
autorestart=true
startretries=20
priority=10

[program:websockify]
command=websockify --web /usr/share/novnc 6901 localhost:5900
autorestart=true
startretries=20
priority=20

# 先把浏览器开好，后面打开网页用 --new-tab 接到这个实例上。
[program:firefox]
command=firefox-esr --remote-debugging-port 9222
user=murasame
environment=DISPLAY=":1",HOME="/home/murasame",PULSE_SERVER="unix:/tmp/murasame-audio.sock",PULSE_SINK="murasame"
autorestart=true
startretries=20
priority=30
