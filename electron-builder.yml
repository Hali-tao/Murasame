appId: com.murasame.desktop
productName: Murasame
copyright: Copyright © 2026 Murasame
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
  - from: isolation
    to: isolation
asar: true
compression: maximum
# 本机已解压的 Electron，避免打包时再去 GitHub 下载同一份。
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Murasame
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  uninstallDisplayName: Murasame
publish: null
