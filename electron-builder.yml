appId: com.murasame.desktop
productName: Murasame
copyright: Copyright © 2026 Murasame
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  # 这几个包自带全平台二进制，Windows 安装包只需要 win32-x64 那一份。
  - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!node_modules/better-sqlite3-multiple-ciphers/prebuilds/win32-arm64.node'
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src}/**'
  # 界面依赖已经被打进 out/renderer，node_modules 里那份运行时用不到。
  - '!node_modules/{react,react-dom,react-router,react-router-dom}/**'
  - '!node_modules/{lucide-react,zustand,clsx,tailwind-merge}/**'
  - '!node_modules/{pixi.js,pixi-live2d-display}/**'
  - '!node_modules/@pixi/**'
  - '!node_modules/@radix-ui/**'
  # 本地语音直接用 @huggingface/transformers，这个包没有被引用。
  - '!node_modules/kokoro-js/**'
extraResources:
  - from: resources
    to: resources
  - from: isolation
    to: isolation
  - from: plugins
    to: plugins
  # 必须先运行 scripts/package-win.mjs 生成本轮已核验的独立暂存目录。
  # 直接调用 electron-builder 且没有该环境变量时明确失败，避免误用旧模型。
  - from: ${env.MURASAME_STAGED_MODELS}
    to: models
asar: true
compression: maximum
# 本机已解压的 Electron，避免打包时再去 GitHub 下载同一份。
electronDist: node_modules/electron/dist
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Murasame
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  uninstallDisplayName: Murasame
publish: null
